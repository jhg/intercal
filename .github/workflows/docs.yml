name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mdBook
        env:
          MDBOOK_VERSION: 0.4.40
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify internal links
        run: |
          set -uo pipefail
          fail=0
          for f in docs/*.md; do
            # grep returns 1 on no matches; treat that as "this file has no .md links" (fine).
            targets=$(grep -oE '\]\(([a-zA-Z][^)#]*\.md)' "$f" 2>/dev/null | sed 's|^]( *||' || true)
            [ -z "$targets" ] && continue
            while IFS= read -r target; do
              [ -z "$target" ] && continue
              if [ ! -f "docs/$target" ]; then
                echo "::error file=$f::link to docs/$target does not resolve"
                fail=1
              fi
            done <<< "$targets"
          done
          # Verify every doc is reachable from SUMMARY.md (warning only, not error).
          ls docs/*.md 2>/dev/null | sed 's|^docs/||' | sort > /tmp/files.txt
          grep -oE '\(([^)]*\.md)\)' docs/SUMMARY.md 2>/dev/null \
            | sed 's/^(//;s/)$//' | sort -u > /tmp/summary.txt
          missing=$(comm -23 /tmp/files.txt /tmp/summary.txt | grep -v '^SUMMARY\.md$' || true)
          if [ -n "$missing" ]; then
            echo "::warning::docs/*.md not referenced in SUMMARY.md:"
            echo "$missing" | sed 's/^/  - /'
          fi
          test "$fail" = "0"

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Build book
        run: mdbook build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: book-preview
          path: ./book
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
