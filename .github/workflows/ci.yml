name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos_arm64
            runs: macos-14
            install: ""
            fixpoint: true
          - name: linux_arm64
            runs: ubuntu-24.04-arm
            install: "sudo apt-get update -qq && sudo apt-get install -y -qq zsh"
            fixpoint: false
          - name: linux_x86_64
            runs: ubuntu-latest
            install: "sudo apt-get update -qq && sudo apt-get install -y -qq zsh"
            fixpoint: false
    name: test-${{ matrix.name }}
    runs-on: ${{ matrix.runs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache apt
        if: startsWith(matrix.runs, 'ubuntu')
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives
          key: ${{ matrix.runs }}-apt-zsh-v1

      - name: Install dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Check platform
        run: sh setup_platform.sh

      - name: Verify template manifest
        run: zsh tools/verify_manifest.sh

      - name: Lint INTERCAL sources
        run: |
          find tests -name '*.i' -print0 | xargs -0 zsh tools/lint_intercal.sh
          zsh tools/lint_intercal.sh src/compiler/*.i src/syslib/*.i

      - name: Lint runtime and template assembly
        run: |
          zsh tools/lint_assembly.sh src/runtime/*.s
          find src/compiler/templates -name '*.s' -print0 | xargs -0 zsh tools/lint_assembly.sh

      - name: Bootstrap test suite
        run: zsh tests/run_tests.sh

      - name: Pure syslib verification
        run: zsh tests/test_syslib_pure.sh

      - name: IR inspection + time report + opt bisect
        run: |
          zsh tests/test_emit_cfg.sh
          zsh tests/test_emit_3addr.sh
          zsh tests/test_emit_tokens.sh
          zsh tests/test_time_report.sh
          zsh tests/test_opt_bisect.sh
          zsh tests/test_peephole_rules.sh
          zsh tests/test_ignore_dce.sh
          zsh tests/test_label_dce.sh
          zsh tests/test_inline_syslib.sh
          zsh tests/test_peephole_dsl.sh
          zsh tests/test_emit_ir_full.sh
          zsh tests/test_emit_ssa.sh
          zsh tests/test_emit_sccp.sh
          zsh tests/test_emit_regalloc.sh
          zsh tests/test_include.sh
          zsh tests/test_emit_effects.sh
          zsh tests/test_bytecode.sh
          zsh tests/test_lsp.sh
          zsh tests/test_effect_elim.sh
          zsh tests/test_sccp_codegen.sh
          zsh tests/test_emit_ir_real.sh
          zsh tests/test_effect_elim_more.sh
          zsh tests/test_new_ir.sh
          zsh tests/test_regalloc_hints.sh
          zsh tests/test_emit_sccp_wz.sh
          zsh tests/test_emit_opt_summary.sh
          zsh tests/test_stage3_substage1.sh
          zsh tests/test_ir_coverage.sh
          zsh tests/test_bytecode_equiv.sh

      - name: Csmith-INTERCAL differential (5 programs)
        run: zsh tests/run_csmith_diff.sh 5

      - name: Build self-hosted compiler
        run: |
          zsh src/bootstrap/intercalc.sh < src/compiler/compiler.i > intercal_core
          chmod +x intercal_core

      - name: Self-hosted test suite
        run: zsh tests/run_self_tests.sh

      - name: Stage 3 (evolving compiler) test suite
        run: zsh tests/run_stage3_tests.sh

      - name: Cache compiled syslib
        uses: actions/cache@v5
        with:
          path: ~/.cache/intercal
          key: syslib-${{ matrix.name }}-${{ hashFiles('src/syslib/syslib.i') }}

      - name: Bootstrap test suite (INTERCAL_SYSLIB=cache mode)
        run: INTERCAL_SYSLIB=cache zsh tests/run_tests.sh

      - name: Three-generation fixpoint (if compiler complete)
        if: matrix.fixpoint && hashFiles('src/compiler/compiler.i') != ''
        run: zsh bootstrap.sh
