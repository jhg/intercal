[book]
title = "INTERCAL Compiler — A Practical Guide"
authors = ["Jesus Hernandez", "Contributors"]
description = "Educational and reference documentation for the INTERCAL compiler in this repository: language tour, compiler internals phase by phase, runtime, syslib, self-hosting, and more."
language = "en"
multilingual = false
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/jhg/intercal"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/jhg/intercal/edit/main/docs/{path}"
site-url = "/intercal/"
no-section-label = false
mathjax-support = false
copy-fonts = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = true
page-break = true
